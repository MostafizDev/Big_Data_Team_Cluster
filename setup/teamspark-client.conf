# TeamSpark client configuration - shared by setup.sh (macOS) and setup.ps1 (Windows)
# and read by verify.py. Format: KEY=VALUE, one per line, no quotes, no spaces.
#
# These must match the server (see ../README.md). Change them only together with
# a server upgrade, and keep requirements.txt in sync with the server image.

# Spark version the server runs; pyspark-client is pinned to the same version.
TEAMSPARK_SPARK_VERSION=4.1.4

# Python minor version used by the server's executors (needed for Python UDFs).
TEAMSPARK_PYTHON_VERSION=3.12

# Spark Connect port published by the server.
TEAMSPARK_DEFAULT_PORT=15002

# uv version used only when no Python 3.12 is found on the machine.
TEAMSPARK_UV_VERSION=0.13.7
