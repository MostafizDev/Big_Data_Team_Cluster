# =============================================================================
# TeamSpark - spark-defaults.conf
# Mounted read-only at $SPARK_CONF_DIR (/opt/teamspark/conf) in every container.
# Edit, then `docker compose restart` (no image rebuild needed).
#
# Resource sizing (cores/memory) is NOT here: it lives in .env and is passed
# on the command line by docker/entrypoint.sh.
# =============================================================================

# ---- Cluster --------------------------------------------------------------
spark.master                                spark://spark-master:7077

# ---- Driver (= Spark Connect server) networking -----------------------------
# Executors connect back to the driver on these fixed ports over the private
# Docker network; none of them are published to the host.
spark.driver.host                           spark-connect
spark.driver.bindAddress                    0.0.0.0
spark.driver.port                           7078
spark.blockManager.port                     7079
spark.port.maxRetries                       4

# ---- Spark Connect ------------------------------------------------------------
spark.connect.grpc.binding.port             15002
# 256 MiB max request (e.g. createDataFrame from local pandas data)
spark.connect.grpc.maxInboundMessageSize    268435456

# ---- Multi-user fairness (sized for 4 concurrent team members) --------------
# All client sessions share ONE Spark application (the Connect server), so use
# FAIR scheduling to stop one user's big job from starving everyone else.
# The TeamSpark client library puts each member's session in its own pool
# (pool name = user name); pools not listed in fairscheduler.xml are created
# on demand with weight 1, so every active member gets an equal share of the
# 8 executor cores (~2 each with 4 busy members, all 8 when working alone).
spark.scheduler.mode                        FAIR
spark.scheduler.allocation.file             file:/opt/teamspark/conf/fairscheduler.xml
# Many small tasks let FAIR scheduling interleave members quickly.
spark.sql.shuffle.partitions                32

# ---- Per-session limits (protect the shared driver) ---------------------------
# Max size of results collected to the driver per action (e.g. collect/toPandas).
spark.driver.maxResultSize                  256m
# Idle client sessions are closed (and their temp views/cache freed) after 30 min.
spark.connect.session.manager.defaultSessionTimeout 30min
# Operations whose client disconnected are cancelled after 5 min.
spark.connect.execute.manager.detachedTimeout 5min

# ---- SQL / catalog: persistent across restarts ------------------------------
spark.sql.catalogImplementation             hive
spark.sql.warehouse.dir                     file:/data/warehouse
spark.hadoop.javax.jdo.option.ConnectionURL jdbc:derby:;databaseName=/data/metastore/metastore_db;create=true
spark.hadoop.datanucleus.schema.autoCreateAll true
spark.hadoop.hive.metastore.schema.verification false
spark.driver.extraJavaOptions               -Dderby.system.home=/data/metastore
spark.sql.adaptive.enabled                  true
spark.sql.session.timeZone                  UTC

# ---- Python (must match client Python minor version for UDFs) ---------------
spark.pyspark.python                        /opt/teamspark/venv/bin/python
spark.pyspark.driver.python                 /opt/teamspark/venv/bin/python
spark.sql.execution.arrow.pyspark.enabled   true

# ---- Storage ------------------------------------------------------------------
spark.local.dir                             /opt/teamspark/scratch

# ---- Event logs -> History Server ---------------------------------------------
spark.eventLog.enabled                      true
spark.eventLog.dir                          file:/data/events
spark.eventLog.rolling.enabled              true
spark.eventLog.rolling.maxFileSize          128m
spark.history.fs.logDirectory               file:/data/events
spark.history.fs.cleaner.enabled            true
spark.history.fs.cleaner.maxAge             14d
spark.history.ui.port                       18080

# ---- Web UIs --------------------------------------------------------------------
# Worker and application UIs are reverse-proxied through the master UI, so
# only the master UI port needs to exist on the host (bound to 127.0.0.1).
spark.ui.reverseProxy                       true
